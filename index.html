<body>
<div class="wrap">
  <header class="top">
    <h1 class="logo">HU тренер <span class="ver">V1.22</span><small>Хедз-ап холдем против GTO-модели</small></h1>
    <button class="gear" id="gear" aria-label="Настройки">⚙</button>
  </header>
  <section id="settings" hidden>
    <div class="grp"><h3>Стартовый стек (со следующего матча)</h3><div class="seg"><button data-stack="100">100 bb</button><button data-stack="200">200 bb</button></div></div>
    <div class="grp"><h3>Разбор решений</h3><div class="seg"><button data-fb="instant">Сразу</button><button data-fb="end">После раздачи</button></div></div>
    <label class="toggle"><input type="checkbox" id="readToggle"> Режим чтения: угадывать действие бота</label>
    <label class="toggle"><input type="checkbox" id="adaptToggle"> Бот адаптируется к моей игре (эксплойт-режим)</label>
    <div class="row" style="margin-top:12px"><button class="primary" id="settingsDone">Готово</button></div>
  </section>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="game">Игра</button>
    <button class="tab" role="tab" data-tab="stats">Статистика</button>
    <button class="tab" role="tab" data-tab="hist">История</button>
  </nav>
  <main id="view-game"><div id="table"></div><div id="actions"></div><div id="info"></div><div id="feed"></div></main>
  <main id="view-stats" hidden></main>
